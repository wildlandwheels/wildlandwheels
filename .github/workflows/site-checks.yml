name: Site checks

on:
  pull_request:
  workflow_call:
    outputs:
      artifact_name:
        description: Checked static site for this exact commit
        value: ${{ jobs.check.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: site-dist-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build once
        run: bash scripts/build.sh
      - name: Check built site
        run: bash scripts/check.sh
      - name: Prove the checks reject bad fixtures
        run: bash scripts/check.sh --self-test
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-review-${{ github.sha }}
          path: artifacts/gallery-check/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload checked site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
