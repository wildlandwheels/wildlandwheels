name: Site checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: bash scripts/build.sh
      - name: Check dist
        run: bash scripts/check.sh
      - name: Prove the checks reject bad fixtures
        run: bash scripts/check.sh --self-test
