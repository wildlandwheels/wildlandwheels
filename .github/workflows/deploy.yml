name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full main commit SHA approved for production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wildlandwheels-pages
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.approved_sha == github.sha))
    uses: ./.github/workflows/site-checks.yml

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.approved_sha == github.sha))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download exact checked artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check.outputs.artifact_name }}
          path: dist

      - name: Verify deployment commit
        env:
          CHECKED_ARTIFACT: ${{ needs.check.outputs.artifact_name }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test "$DEPLOY_REF" = refs/heads/main
          test "$CHECKED_ARTIFACT" = "site-dist-$DEPLOY_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$APPROVED_SHA" = "$DEPLOY_SHA"
          else
            test "$EVENT_NAME" = push
          fi
          test -s dist/index.html
          test -s dist/photography/index.html

      - name: Deploy checked site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wildlandwheels --branch=main --commit-hash=${{ github.sha }}
